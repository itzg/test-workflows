name: Release on merge

on:
  pull_request:
    types: [closed]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run Release on Merge Action
        id: release-on-merge
        uses: itzg/release-on-merge-action@v1.0.0
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN }}